<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5F5F5">
<meta name="description" content="Three animated views of interest earnings growing toward the next milestone.">
<title>Earnings in motion · Tempo Cash</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23000000'/%3E%3Ccircle cx='24' cy='32' r='7' fill='%2313A963'/%3E%3Ccircle cx='42' cy='32' r='7' fill='%2313A963'/%3E%3C/svg%3E">
<style>
@font-face{font-family:'Inter Display';src:url('./fonts/InterDisplay-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Inter Display';src:url('./fonts/InterDisplay-Medium.ttf') format('truetype');font-weight:500;font-display:swap}
:root{font-family:'Inter Display',Inter,Arial,sans-serif;color:#000;background:#f5f5f5;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;min-width:320px}
.page{max-width:1560px;margin:0 auto;padding:36px clamp(20px,3vw,48px) 76px}
.header{display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{display:block;width:148px;height:33px;object-fit:contain;object-position:left center}
.header-note{font-size:13px;line-height:1.4;letter-spacing:.04em;color:#707070;text-transform:uppercase}
h1{font-size:clamp(36px,4.4vw,64px);font-weight:500;letter-spacing:-.045em;line-height:1.05;margin:70px 0 46px}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.state{margin:0;min-width:0}
.state figcaption{font-size:16px;line-height:1.4;font-weight:500;margin:0 0 12px}
.graphic{background:#fff;border:1px solid #e0e0e0;border-radius:18px;overflow:hidden;min-width:0}
.graphic svg{display:block;width:100%;height:auto;aspect-ratio:3/1;padding:0 10px}
.point.filled{fill:#13a963}.point.empty{fill:#e0e0e0}
.pulse-core{fill:#13a963;opacity:.23;animation:core 2.4s ease-in-out infinite}
.pulse-ring{fill:none;stroke:#13a963;stroke-width:1.1;opacity:.72;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
.graphic p{font-size:clamp(15px,1.4vw,19px);line-height:1.3;font-weight:400;margin:7px 24px 24px;white-space:nowrap}
.graphic strong{font-weight:500}
@keyframes ring{0%{transform:scale(.45);opacity:.7}75%{transform:scale(1.7);opacity:0}100%{transform:scale(1.7);opacity:0}}
@keyframes core{0%,100%{opacity:.2}45%{opacity:.85}}
@media(max-width:1100px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.graphic p{font-size:18px}}
@media(max-width:700px){.page{padding:24px 16px 48px}.logo{width:118px;height:auto}.header-note{font-size:11px}h1{margin:55px 0 30px}.gallery{grid-template-columns:1fr;gap:24px}.state figcaption{font-size:15px}.graphic p{font-size:17px;margin:8px 20px 22px}}
@media(prefers-reduced-motion:reduce){.pulse-core,.pulse-ring{animation:none}.pulse-core{opacity:.65}.pulse-ring{opacity:.35}}
</style>
</head>
